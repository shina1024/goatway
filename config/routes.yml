- from:
    path: '^/sample/(.+)$'
    clients:
      - SampleClient
    ip_range_groups:
      - SampleIPRange
  to:
    destinations:
      - target_group: TargetGroupA
        path: '/$1'
      - target_group: TargetGroupB
        path: '/$1'

