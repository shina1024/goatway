version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    # golangci-lint v2 folds the former gosimple analyzer into staticcheck.
    - staticcheck
    - unused
    - ineffassign
    - errcheck
    - gosec
    - bodyclose

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: goatway
