name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Format check
        run: |
          # gofumpt is the project formatter (stricter than gofmt)
          go run mvdan.cc/gofumpt@v0.10.0 -l .
          test -z "$(go run mvdan.cc/gofumpt@v0.10.0 -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race enabled)
        run: go test -race -shuffle=on -count=1 ./...
